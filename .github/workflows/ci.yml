name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
  schedule:
    - cron: '0 9 * * 1' # weekly: external links and dependency audit

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types and content schemas
        run: npm run check
      - name: Validation (banned terms, em dashes, paths, provenance, featured set, redirects)
        run: npm run validate
      - name: Build (production)
        run: npm run build
      - name: Validation against the built output
        run: npm run validate
      - name: Deliberate breaks must fail (invalid frontmatter, dangling related, unresolved wikilink, em dash, missing og:image:alt)
        run: node scripts/check-build-fails-on-invalid.mjs
      - name: Build report (pages, evidence, integrity, index size)
        run: npm run report
      - name: HTML validity
        run: npx html-validate "dist/**/*.html"
      - name: Internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir lets lychee resolve root-relative links such as /work/ against dist/
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright (structure, nav, home, climb, JS off, targets, headers, security, content, résumé, SEO, axe)
        run: npx playwright test
        env:
          CI: 'true'
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report
            build-report.json
          if-no-files-found: ignore

  # Every template on the throttled mobile profile, five runs each (vault document 13): about 130
  # Lighthouse runs, split three ways so the wall time stays near the build job's. Each shard
  # takes its share of lighthouserc.json's list; the assertions are the same file.
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (shard ${{ matrix.shard }} of 3)
        # Run through npx so the Lighthouse toolchain (which carries unfixed transitive advisories)
        # never enters this repository's dependency tree or the audit gate.
        run: node scripts/lhci-shard.mjs ${{ matrix.shard }} 3
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.shard }}
          path: .lighthouseci
          if-no-files-found: ignore

  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Preview build renders drafts with noindex
        run: |
          npm run build:preview
          grep -q 'name="robots" content="noindex' dist/index.html
          test -f dist/notes/wanderer-pipeline/index.html
          grep -q 'Disallow: /' dist/robots.txt

  weekly-external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: false
      - name: Dependency audit (weekly repeat of the per-push gate)
        run: npm audit --audit-level=high
