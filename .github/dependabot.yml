version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['@playwright/*', '@axe-core/*', '@lhci/*', 'html-validate']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
