# Provenance record for the climb island's assets (P2-SEC-16). One entry per file under
# public/climb/; scripts/validate.mjs fails the build when a file has no entry or an entry names a
# missing file. Every statement below is the owner's own account from the published V1 case study
# (content/projects/khaylub-com-v1/index.md, "What went wrong" and the role line), approved 2026-09-12;
# the generating service for the two 3D bases is not named (owner, 2026-10-08).
# The concept films, their posters, and the mountain vista still are NOT here: their generator and
# terms are not yet recorded (26 - Project Media Inventory, "Needs Confirmation"), so they stay out
# of the port until the owner records them.
files:
  wanderer-web.glb:
    source: The Wanderer character. Base mesh and auto-rig generated from the author's reference image, then cleaned, re-rigged where the generation failed, and finished in Blender by the author; exported with meshopt compression for the web. Copied unchanged from khaylub-portfolio at tag v1.0.0-3d-experiment.
    license: All rights reserved for the author's finished asset; the generated base mesh is output under the author's account, and that service's terms apply.
    generator: A 3D generation service (base mesh and auto-rig); Blender finishing by the author
    date: 2026-06-18
  phoenix-flap.glb:
    source: The Phoenix. Began as a 3D generation, retopologized and auto-rigged by the same service, then finished and animated (the flap clip) in Blender by the author. The author's V1 case study states this origin and notes that the media inventory's origin record for the model is still marked for confirmation; this entry repeats the case study's words pending that confirmation. Copied unchanged from khaylub-portfolio at tag v1.0.0-3d-experiment (PhoenixFlap.web.glb).
    license: All rights reserved for the author's finished asset; the generated base mesh is output under the author's account, and that service's terms apply.
    generator: A 3D generation service (base mesh, retopology, auto-rig); Blender finishing by the author
    date: 2026-06-20
